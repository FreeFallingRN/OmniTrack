name: Deploy Moon+ Sync Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'sync-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Clasp and Dependencies
        working-directory: ./sync-worker
        run: |
          npm ci
          npm install -g @google/clasp

      - name: Create Clasp Credentials
        working-directory: ./sync-worker
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          echo "$CLASP_JSON" > .clasp.json

      - name: Build and Push to Google Apps Script
        working-directory: ./sync-worker
        run: |
          npm run build
          clasp push --force
