name: Build & Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from build.gradle.kts
        id: gradle_version
        run: |
          # Extract versionName value from app/build.gradle.kts
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)"/\1/')
          echo "Gradle versionName: $VERSION_NAME"
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Verify Tag matches Gradle Version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          GRADLE_VERSION=${{ steps.gradle_version.outputs.version }}

          echo "Checking tag v$TAG_VERSION against Gradle version $GRADLE_VERSION"

          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Error: Git tag (v$TAG_VERSION) does not match versionName ($GRADLE_VERSION) in app/build.gradle.kts!"
            exit 1
          else
            echo "Version check passed successfully!"
          fi

  release:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > omnitrack-release.jks
          if [ ! -s omnitrack-release.jks ]; then
            echo "Error: omnitrack-release.jks is 0 bytes. Check KEYSTORE_BASE64 secret in GitHub."
            exit 1
          fi
          echo "Keystore decoded successfully ($(wc -c < omnitrack-release.jks) bytes)."
        working-directory: android

      - name: Grant Execute Permission for Gradle
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Prepare Release Artifact
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          APK_FILE=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in release output directory!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          mv "$APK_FILE" "android/app/build/outputs/apk/release/omnitrack-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/omnitrack-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
