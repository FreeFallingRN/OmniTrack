# Increase Gradle Daemon JVM memory allocation
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Enable KSP2 Engine for Kotlin 2.x
ksp.useKSP2=true

# Standard AndroidX & Optimization Flags
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppress residual AGP 9.0+ internal DSL warnings from third-party plugins
android.sync.suppressAgpWarnings=DEPRECATED_DSL,UNSUPPORTED_PROJECT_OPTION_USE,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED