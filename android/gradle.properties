# Build Speed & Caching Optimizations
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# JVM Heap & AndroidX Settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true
ksp.useKSP2=true

# Suppress AGP 9.0+ Internal Warning Logs
android.sync.suppressAgpWarnings=DEPRECATED_DSL,UNSUPPORTED_PROJECT_OPTION_USE,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
